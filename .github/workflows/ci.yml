# 持续集成：push / PR 到 main 时全量自测
# 命令与 DevelopmentGuidelines/versioning.md §5 步骤 4 保持一致

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 单元测试
        run: npm run verify:unit

      - name: 集成测试
        run: npm run verify:integration
